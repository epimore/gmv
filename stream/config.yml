log:
  level: warn
  stdout: true
  prefix: stream
  store_path: ./logs
  specify:
    - crate_name: gmv_stream
      level: info
    - crate_name: gmv_nodec
      level: debug
    - crate_name: h2 #h2日志等级
      level: warn #日志等级
guard:
  endpoint: http://127.0.0.1:18080 # guard内部gRPC地址，stream向guard注册、上报事件

server:
  name: s1 #服务标识身份,流媒体集群唯一标识，guard注册时节点ID
  host: 192.168.0.9 #注册到guard的本节点访问地址；分布式部署时配置为节点内网或业务可达地址
  rtp_port: 28568 #监听rtp媒体流端口;
  rtcp_port: 18569 #监听rtcp媒体流端口;  暂未实现
  http_port: 28570 #流媒体API端口
  grpc:
    addr: 127.0.0.1:19082 #stream内部控制gRPC地址，注册到guard并用于节点间控制
    tls:
      enabled: false # 推荐生产启用；启用后节点上报grpcs，并要求配置证书。
      certificate_path: ""
      private_key_path: ""
  http:
    tls:
      enabled: false # 推荐生产启用；启用后播放地址默认生成https，并要求配置证书。
      certificate_path: ""
      private_key_path: ""
  #流代理地址:http://127.0.0.1:[server.http_port]，用于如nginx代理
  #默认播放地址：http://127.0.0.1:[server.http_port]/[server.name]/play/[stream_id].flv?gmv-token=uxxx
  proxy_addr: http://127.0.0.1:28570 #eg:https://epimore.cn/s1/play/4FEqqzfqsa0Vzqqq2lqqc1lqq4fa.flv?gmv-token=uxxx;
stream: #Stream 数据面生命周期；单流内部覆盖优先于本配置，不属于 Guard/Player 启动超时
  in_wait_timeout: 4 #单位秒；连续无 RTP 包判死时间，范围 1-30，建议 2-8
  out_idle_timeout: 20 #单位秒；output/viewer session 延迟释放时间，范围 12-120，建议 15-60
