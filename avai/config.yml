log:
  level: warn
  stdout: true
  prefix: avai
  store_path: ./logs
  specify:
    - crate_name: avai
      level: info

guard:
  endpoint: http://127.0.0.1:18080

server:
  installation_id: local-installation
  management_component_id: avai
  management_socket: /run/gmv/avai-management.sock
  host_id: local-host
  node_id: avai-node-1
  host: 127.0.0.1
  grpc_port: 19080
  capabilities:
    - image.metadata.inspect
  task_database_path: ./data/avai.db
  object_root: ./data/objects
  task_queue_size: 128
  task_worker_count: 2
  allow_private_image_urls: false
  allowed_internal_hosts: []

model:
  database_path: ./data/avai-model.db
  root: ./data/models
  trusted_import_root: ./data/model-import
  architecture: x86_64
  allowed_runtime_ids: []
  allowed_accelerators:
    - cpu
  allowed_result_schemas: []
  approved_spdx: []
  available_license_refs: []
  trusted_signing_keys: {}
  max_manifest_bytes: 262144
  max_file_count: 256
  max_package_bytes: 4294967296
  max_memory_mb: 16384
  max_vram_mb: 16384
  max_loaded_models: 8
  operation_receipt_capacity: 4096
  operation_retention_ms: 86400000
  mutation_concurrency: 1
