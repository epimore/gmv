log:
  level: warn
  stdout: true
  prefix: avai
  store_path: ./logs
  specify:
    - crate_name: avai
      level: info

guard:
  endpoint: http://127.0.0.1:18080

server:
  node_id: avai-node-1
  host: 127.0.0.1
  grpc_port: 19080
  capabilities:
    - image.metadata.inspect
  task_database_path: ./data/avai.db
  object_root: ./data/objects
  task_queue_size: 128
  task_worker_count: 2
  allow_private_image_urls: false
  allowed_internal_hosts: []
