[package]
name = "gmv-nodec"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# base = { git = "https://github.com/epimore/pigs.git", rev = "6ef154f", features = ["net"] }
base = { path = "../../../pigs/base", features = ["net"] }
# base_rpc = { git = "https://github.com/epimore/pigs.git", rev = "6ef154f" }
base_rpc = { path = "../../../pigs/base_rpc" }
gmv-protocol = { path = "../protocol" }
# sys_metrics = { git = "https://github.com/epimore/pigs.git", rev = "6ef154f" }
sys_metrics = { path = "../../../pigs/sys_metrics" }
tonic = "0.14"
tokio-stream = "0.1"
uuid = { version = "1.23", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
