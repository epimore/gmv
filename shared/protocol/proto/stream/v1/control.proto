syntax = "proto3";

package gmv.stream.v1;

import "common/v1/types.proto";

service StreamControl {
  rpc StartReceive(StartReceiveRequest) returns (StartReceiveResponse);
  rpc StopReceive(StopReceiveRequest) returns (StopReceiveResponse);
  rpc QueryStream(QueryStreamRequest) returns (QueryStreamResponse);
  rpc CreateOutput(CreateOutputRequest) returns (CreateOutputResponse);
  rpc CloseOutput(CloseOutputRequest) returns (CloseOutputResponse);
  rpc ReleaseSubscriptionOutputs(ReleaseSubscriptionOutputsRequest) returns (ReleaseSubscriptionOutputsResponse);
  rpc GetPlaybackEndpoints(GetPlaybackEndpointsRequest) returns (GetPlaybackEndpointsResponse);

  rpc InitMedia(StreamJsonRequest) returns (StreamUnitResponse);
  rpc InitMediaExt(StreamJsonRequest) returns (StreamUnitResponse);
  rpc StreamOnline(StreamJsonRequest) returns (StreamBoolResponse);
  rpc RecordInfo(StreamJsonRequest) returns (StreamJsonResponse);
  rpc CloseOutputBySsrc(StreamJsonRequest) returns (StreamUnitResponse);
  rpc TalkOpen(StreamJsonRequest) returns (StreamJsonResponse);
  rpc TalkAnswer(StreamJsonRequest) returns (StreamUnitResponse);
  rpc TalkClose(StreamJsonRequest) returns (StreamUnitResponse);
  rpc TalkOnline(StreamJsonRequest) returns (StreamBoolResponse);
}

message StartReceiveRequest {
  gmv.common.v1.OperationRef operation = 1;
  string stream_id = 2;
  string route_id = 3;
  string lease_id = 4;
  gmv.common.v1.NodeIdentity expected_stream = 5;
  // Node registration endpoints describe node capabilities. Preferred endpoints
  // constrain allocation but are not concrete media listeners.
  repeated gmv.common.v1.Endpoint preferred_endpoints = 6;
  map<string, string> constraints = 7;
  uint64 reservation_ttl_ms = 8;
}

message StartReceiveResponse {
  string stream_id = 1;
  StreamState state = 2;
  // Receive endpoints are concrete listeners allocated for this stream. Dynamic
  // endpoints carry endpoint_id and generation labels and must not be replaced
  // with a node-level ENDPOINT_MODE_MULTI capability endpoint.
  repeated gmv.common.v1.Endpoint receive_endpoints = 3;
  gmv.common.v1.ErrorDetail error = 4;
}

message StopReceiveRequest {
  gmv.common.v1.OperationRef operation = 1;
  string stream_id = 2;
  string reason = 3;
  StopReceivePhase phase = 4;
  string expected_ssrc = 5;
  uint64 expected_lifecycle_generation = 6;
  uint64 expected_packet_count = 7;
  // Guard lease termination uses these fields to fence a late release from a
  // newer media runtime that reused the same business stream_id.
  string expected_lease_id = 8;
  string expected_route_id = 9;
}

message StopReceiveResponse {
  StreamState state = 1;
  gmv.common.v1.ErrorDetail error = 2;
  bool outputs_closed = 3;
  bool input_removed = 4;
  string ssrc = 5;
  uint64 lifecycle_generation = 6;
  uint64 last_packet_at_ms = 7;
  uint64 packet_count = 8;
  uint64 input_idle_timeout_ms = 9;
}

enum StopReceivePhase {
  STOP_RECEIVE_PHASE_UNSPECIFIED = 0;
  STOP_RECEIVE_PHASE_QUIESCE_OUTPUTS = 1;
  STOP_RECEIVE_PHASE_FINALIZE = 2;
}

message QueryStreamRequest {
  string stream_id = 1;
}

message QueryStreamResponse {
  string stream_id = 1;
  StreamState state = 2;
  repeated gmv.common.v1.Endpoint outputs = 3;
  string playback_id = 4;
  uint64 playback_generation = 5;
  uint64 source_position_ms = 6;
  bool media_ready = 7;
  string terminal_reason = 8;
  uint32 viewer_count = 9;
  repeated ViewerFormatCount viewer_formats = 10;
  string ssrc = 11;
  uint64 lifecycle_generation = 12;
  uint64 last_packet_at_ms = 13;
  uint64 packet_count = 14;
  uint64 input_idle_timeout_ms = 15;
  bool input_observed = 16;
  string primary_output_format = 17;
}

message ViewerFormatCount {
  string media_format = 1;
  uint32 viewer_count = 2;
}

message CreateOutputRequest {
  gmv.common.v1.OperationRef operation = 1;
  string stream_id = 2;
  string output_type = 3;
  gmv.common.v1.EndpointMode endpoint_mode = 4;
  string audio_codec = 5;
  string subscription_id = 6;
}

message CreateOutputResponse {
  string output_id = 1;
  repeated gmv.common.v1.Endpoint endpoints = 2;
  gmv.common.v1.ErrorDetail error = 3;
  OutputInfo output = 4;
}

message CloseOutputRequest {
  gmv.common.v1.OperationRef operation = 1;
  string output_id = 2;
  string stream_id = 3;
}

message CloseOutputResponse {
  bool closed = 1;
  gmv.common.v1.ErrorDetail error = 2;
  OutputInfo output = 3;
}

message ReleaseSubscriptionOutputsRequest {
  gmv.common.v1.OperationRef operation = 1;
  string stream_id = 2;
  string subscription_id = 3;
}

message ReleaseSubscriptionOutputsResponse {
  repeated string closed_output_ids = 1;
  gmv.common.v1.ErrorDetail error = 2;
}

message GetPlaybackEndpointsRequest {
  string stream_id = 1;
}

message GetPlaybackEndpointsResponse {
  repeated gmv.common.v1.Endpoint endpoints = 1;
  repeated OutputInfo outputs = 2;
}

message OutputInfo {
  string output_id = 1;
  string stream_id = 2;
  string output_type = 3;
  string endpoint = 4;
  OutputState state = 5;
  string subscription_id = 6;
}

enum OutputState {
  OUTPUT_STATE_UNSPECIFIED = 0;
  OUTPUT_STATE_PREPARING = 1;
  OUTPUT_STATE_READY = 2;
  OUTPUT_STATE_CLOSED = 3;
  OUTPUT_STATE_FAILED = 4;
}

enum StreamState {
  STREAM_STATE_UNSPECIFIED = 0;
  STREAM_STATE_STARTING = 1;
  STREAM_STATE_RECEIVING = 2;
  STREAM_STATE_STOPPING = 3;
  STREAM_STATE_STOPPED = 4;
  STREAM_STATE_FAILED = 5;
}

message StreamJsonRequest {
  bytes payload_json = 1;
  string subscription_id = 2;
}

message StreamUnitResponse {
  gmv.common.v1.ErrorDetail error = 1;
}

message StreamBoolResponse {
  bool value = 1;
  gmv.common.v1.ErrorDetail error = 2;
}

message StreamJsonResponse {
  bytes payload_json = 1;
  gmv.common.v1.ErrorDetail error = 2;
}
