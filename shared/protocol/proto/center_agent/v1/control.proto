syntax = "proto3";

package gmv.center_agent.v1;

import "common/v1/types.proto";

message GmvCenterAgentToCenterMessage {
  string message_id = 1;
  uint64 sequence = 2;
  int64 sent_at_epoch_ms = 3;
  string installation_id = 4;
  string gmv_center_agent_instance_id = 5;
  uint32 protocol_version = 6;
  string host_id = 7;
  oneof payload {
    GmvCenterAgentHello hello = 10;
    GmvCenterAgentHeartbeat heartbeat = 11;
    InventorySnapshot inventory = 12;
    DeliveryReceipt delivery_receipt = 13;
    CommandReceipt command_receipt = 14;
    UpgradeRequest upgrade_request = 15;
    GmvCenterAgentPresence presence = 16;
  }
}

message CenterToGmvCenterAgentMessage {
  string message_id = 1;
  uint64 sequence = 2;
  int64 sent_at_epoch_ms = 3;
  string installation_id = 4;
  string expected_gmv_center_agent_instance_id = 5;
  uint32 protocol_version = 6;
  string host_id = 7;
  oneof payload {
    DesiredState desired_state = 10;
    TypedCommand command = 11;
    ReceiptAck receipt_ack = 12;
    UpgradeDecision upgrade_decision = 13;
  }
}

message ReceiptAck {
  string receipt_message_id = 1;
}

message GmvCenterAgentHello {
  gmv.common.v1.NodeIdentity identity = 1;
  string software_version = 2;
  string manifest_revision = 3;
  string platform = 4;
  string architecture = 5;
}

message GmvCenterAgentHeartbeat {
  int64 observed_at_epoch_ms = 1;
  string current_revision = 2;
  string desired_revision = 3;
  string staged_revision = 4;
}

message GmvCenterAgentPresence {
  bool online = 1;
  int64 observed_at_epoch_ms = 2;
}

message InventorySnapshot {
  string manifest_revision = 1;
  int64 observed_at_epoch_ms = 2;
  repeated ComponentObservation components = 3;
}

message ComponentObservation {
  string component_id = 1;
  string service_type = 2;
  string declared_version = 3;
  string observed_version = 4;
  ComponentState state = 5;
  string stable_reason = 6;
}

enum ComponentState {
  COMPONENT_STATE_UNSPECIFIED = 0;
  COMPONENT_STATE_UNKNOWN = 1;
  COMPONENT_STATE_RUNNING = 2;
  COMPONENT_STATE_STOPPED = 3;
  COMPONENT_STATE_MISSING = 4;
  COMPONENT_STATE_VERSION_MISMATCH = 5;
  COMPONENT_STATE_UNMANAGED = 6;
}

message ArtifactManifest {
  string artifact_id = 1;
  string version = 2;
  string revision = 3;
  ArtifactKind kind = 4;
  string platform = 5;
  string architecture = 6;
  string required_gmv_center_agent_version = 7;
  string gmv_compatibility = 8;
  uint64 content_size = 9;
  string sha256 = 10;
  bytes signature = 11;
  string signing_key_id = 12;
  string package_layout_version = 13;
  string license_id = 14;
  string source_framework = 15;
  string base_model = 16;
  string redistribution_policy = 17;
  string training_lineage = 18;
  string download_url = 19;
  int64 download_expires_at_epoch_ms = 20;
}

enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_GMV_BUNDLE = 1;
  ARTIFACT_KIND_AI_MODEL = 2;
}

message DesiredState {
  string assignment_id = 1;
  string channel = 2;
  ArtifactManifest artifact = 3;
  int64 deadline_epoch_ms = 4;
}

message UpgradeRequest {
  string request_id = 1;
  ArtifactKind artifact_kind = 2;
  string channel = 3;
  string current_revision = 4;
  string target_revision = 5;
}

message UpgradeDecision {
  string request_id = 1;
  bool accepted = 2;
  string stable_reason = 3;
  DesiredState desired_state = 4;
}

message DeliveryReceipt {
  string assignment_id = 1;
  string artifact_id = 2;
  string revision = 3;
  DeliveryState state = 4;
  string stable_error_code = 5;
  string detail_digest = 6;
  int64 observed_at_epoch_ms = 7;
}

enum DeliveryState {
  DELIVERY_STATE_UNSPECIFIED = 0;
  DELIVERY_STATE_NOTICED = 1;
  DELIVERY_STATE_DOWNLOADING = 2;
  DELIVERY_STATE_DOWNLOADED = 3;
  DELIVERY_STATE_VERIFIED = 4;
  DELIVERY_STATE_STAGED = 5;
  DELIVERY_STATE_FAILED = 6;
  DELIVERY_STATE_ACTIVE = 7;
  DELIVERY_STATE_ROLLED_BACK = 8;
}

message TypedCommand {
  string command_id = 1;
  GmvCenterAgentCommandType command_type = 2;
  int64 deadline_epoch_ms = 3;
  string expected_manifest_revision = 4;
  string operation_id = 5;
  string installation_id = 6;
  string host_id = 7;
  string component_id = 8;
  oneof request {
    InventoryRefreshRequest inventory_refresh = 10;
    HealthSnapshotRequest health_snapshot = 11;
    ServiceStartRequest service_start = 12;
    ServiceStopRequest service_stop = 13;
    ServiceRestartRequest service_restart = 14;
    LogQueryRequest log_query = 15;
    DiagnosticCollectRequest diagnostic_collect = 16;
  }
}

enum GmvCenterAgentCommandType {
  GMV_CENTER_AGENT_COMMAND_TYPE_UNSPECIFIED = 0;
  GMV_CENTER_AGENT_COMMAND_TYPE_INVENTORY_REFRESH = 1;
  GMV_CENTER_AGENT_COMMAND_TYPE_HEALTH_SNAPSHOT = 2;
  GMV_CENTER_AGENT_COMMAND_TYPE_SERVICE_START = 3;
  GMV_CENTER_AGENT_COMMAND_TYPE_SERVICE_STOP = 4;
  GMV_CENTER_AGENT_COMMAND_TYPE_SERVICE_RESTART = 5;
  GMV_CENTER_AGENT_COMMAND_TYPE_LOG_QUERY = 6;
  GMV_CENTER_AGENT_COMMAND_TYPE_DIAGNOSTIC_COLLECT = 7;
}

message InventoryRefreshRequest {}

message HealthSnapshotRequest {}

message ServiceStartRequest {}

message ServiceStopRequest {}

message ServiceRestartRequest {}

message LogQueryRequest {
  int64 since_epoch_ms = 1;
  int64 until_epoch_ms = 2;
  uint32 tail_lines = 3;
  string level = 4;
  string keyword = 5;
  uint32 max_lines = 6;
  uint64 max_bytes = 7;
}

message DiagnosticCollectRequest {}

enum CommandFailureReason {
  COMMAND_FAILURE_REASON_UNSPECIFIED = 0;
  COMMAND_FAILURE_REASON_DEADLINE_EXPIRED = 1;
  COMMAND_FAILURE_REASON_UNKNOWN_COMPONENT = 2;
  COMMAND_FAILURE_REASON_UNSUPPORTED_CAPABILITY = 3;
  COMMAND_FAILURE_REASON_MANIFEST_MISMATCH = 4;
  COMMAND_FAILURE_REASON_ALREADY_TERMINAL = 5;
  COMMAND_FAILURE_REASON_BUSY_CONFLICT = 6;
}

enum CommandStepState {
  COMMAND_STEP_STATE_UNSPECIFIED = 0;
  COMMAND_STEP_STATE_RUNNING = 1;
  COMMAND_STEP_STATE_SUCCEEDED = 2;
  COMMAND_STEP_STATE_FAILED = 3;
  COMMAND_STEP_STATE_SKIPPED = 4;
}

message CommandStepResult {
  string step_name = 1;
  CommandStepState state = 2;
  int64 started_at_epoch_ms = 3;
  int64 completed_at_epoch_ms = 4;
  CommandFailureReason failure_reason = 5;
  string stable_error_code = 6;
  string result_summary = 7;
}

message CommandResultArtifactRef {
  string artifact_id = 1;
  string media_type = 2;
  uint64 content_size = 3;
  string sha256 = 4;
}

message CommandReceipt {
  string command_id = 1;
  CommandState state = 2;
  string stable_error_code = 3;
  bytes result = 4 [deprecated = true];
  int64 completed_at_epoch_ms = 5;
  string operation_id = 6;
  string component_id = 7;
  int64 started_at_epoch_ms = 8;
  repeated CommandStepResult steps = 9;
  string result_summary = 10;
  CommandResultArtifactRef result_artifact = 11;
  CommandFailureReason failure_reason = 12;
}

enum CommandState {
  COMMAND_STATE_UNSPECIFIED = 0;
  COMMAND_STATE_SUCCEEDED = 1;
  COMMAND_STATE_FAILED = 2;
  COMMAND_STATE_REJECTED = 3;
}
