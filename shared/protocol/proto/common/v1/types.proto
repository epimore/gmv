syntax = "proto3";

package gmv.common.v1;

message NodeIdentity {
  string node_id = 1;
  string instance_id = 2;
  NodeKind kind = 3;
}

enum NodeKind {
  NODE_KIND_UNSPECIFIED = 0;
  NODE_KIND_GUARD = 1;
  NODE_KIND_SESSION = 2;
  NODE_KIND_STREAM = 3;
  NODE_KIND_AVAI = 4;
  NODE_KIND_GMV_CENTER_AGENT = 5;
}

enum EndpointMode {
  ENDPOINT_MODE_UNSPECIFIED = 0;
  ENDPOINT_MODE_SINGLE = 1;
  ENDPOINT_MODE_MULTI = 2;
}

message Endpoint {
  string name = 1;
  string scheme = 2;
  string host = 3;
  uint32 port = 4;
  EndpointMode mode = 5;
  map<string, string> labels = 6;
}

enum TransportMode {
  TRANSPORT_MODE_UNSPECIFIED = 0;
  TRANSPORT_MODE_DATAGRAM = 1;
  TRANSPORT_MODE_STREAM = 2;
}

message TransportCapabilities {
  bool reliable = 1;
  bool ordered = 2;
  bool preserves_message_boundary = 3;
  bool encrypted = 4;
  bool congestion_controlled = 5;
  bool local_only = 6;
  uint64 max_message_size = 7;
  TransportMode mode = 8;
}

message DataEndpoint {
  string name = 1;
  string uri = 2;
  TransportCapabilities capabilities = 3;
  map<string, string> labels = 4;
}

message AccessGrant {
  string grant_id = 1;
  NodeIdentity expected_consumer = 2;
  string purpose = 3;
  int64 expires_at_epoch_ms = 4;
  repeated DataEndpoint endpoints = 5;
  bytes proof = 6;
}

message ResourceRef {
  string resource_id = 1;
  string resource_type = 2;
}

message OperationRef {
  string operation_id = 1;
  string idempotency_key = 2;
}

message ErrorDetail {
  string code = 1;
  string message = 2;
  map<string, string> metadata = 3;
}

message PageRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

message PageResponse {
  string next_page_token = 1;
}
