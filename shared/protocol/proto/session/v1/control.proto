message CloudRecordingSummary {
  string task_id = 1;
  string request_id = 2;
  string session_node_id = 3;
  string device_id = 4;
  string channel_id = 5;
  int64 start_time_sec = 6;
  int64 end_time_sec = 7;
  uint64 requested_duration_sec = 8;
  CloudRecordingStatus status = 9;
  CloudRecordingFileState file_state = 10;
  uint32 progress_percent = 11;
  uint64 recorded_duration_ms = 12;
  bool progress_stale = 13;
  uint64 current_size_bytes = 14;
  uint64 final_size_bytes = 15;
  string file_format = 16;
  string requested_by = 17;
  int64 created_at_ms = 18;
  int64 started_at_ms = 19;
  int64 finished_at_ms = 20;
  int64 updated_at_ms = 21;
  string error_code = 22;
  string error_message = 23;
  bool can_stop = 24;
  bool can_play = 25;
  bool can_download = 26;
  bool can_delete = 27;
  string stream_id = 28;
}

enum CloudRecordingStatus {
  CLOUD_RECORDING_STATUS_UNSPECIFIED = 0;
  CLOUD_RECORDING_STATUS_STARTING = 1;
  CLOUD_RECORDING_STATUS_RUNNING = 2;
  CLOUD_RECORDING_STATUS_STOPPING = 3;
  CLOUD_RECORDING_STATUS_COMPLETED = 4;
  CLOUD_RECORDING_STATUS_STOPPED = 5;
  CLOUD_RECORDING_STATUS_PARTIAL = 6;
  CLOUD_RECORDING_STATUS_FAILED = 7;
  CLOUD_RECORDING_STATUS_DELETING = 8;
  CLOUD_RECORDING_STATUS_DELETED = 9;
}

enum CloudRecordingFileState {
  CLOUD_RECORDING_FILE_STATE_UNSPECIFIED = 0;
  CLOUD_RECORDING_FILE_STATE_NONE = 1;
  CLOUD_RECORDING_FILE_STATE_WRITING = 2;
  CLOUD_RECORDING_FILE_STATE_READY = 3;
  CLOUD_RECORDING_FILE_STATE_MISSING = 4;
  CLOUD_RECORDING_FILE_STATE_DELETED = 5;
}
