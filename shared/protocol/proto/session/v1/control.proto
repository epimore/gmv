syntax = "proto3";

package gmv.session.v1;

import "common/v1/types.proto";

service SessionControl {
  rpc GetSessionConfig(GetSessionConfigRequest) returns (GetSessionConfigResponse);
  rpc StartLive(StartDeviceStreamRequest) returns (DeviceStreamResponse);
  rpc StartPlayback(StartDeviceStreamRequest) returns (DeviceStreamResponse);
  rpc StartDownload(StartDeviceStreamRequest) returns (DeviceStreamResponse);
  rpc StartBroadcast(StartDeviceStreamRequest) returns (DeviceStreamResponse);
  rpc StopDeviceStream(StopDeviceStreamRequest) returns (DeviceStreamResponse);
  rpc ListActiveStreams(ListActiveStreamsRequest) returns (ListActiveStreamsResponse);
  rpc ListActiveStreamDialogs(ListActiveStreamDialogsRequest) returns (ListActiveStreamDialogsResponse);
  rpc GetActiveStreamManagement(GetActiveStreamManagementRequest) returns (GetActiveStreamManagementResponse);
  rpc ListStreamHistory(ListStreamHistoryRequest) returns (ListStreamHistoryResponse);
  rpc SetPlaybackSpeed(SetPlaybackSpeedRequest) returns (SetPlaybackSpeedResponse);
  rpc SeekPlayback(SeekPlaybackRequest) returns (PlaybackControlResponse);
  rpc SetPlaybackState(SetPlaybackStateRequest) returns (PlaybackControlResponse);
  rpc RefreshPlaybackPresence(RefreshPlaybackPresenceRequest) returns (RefreshPlaybackPresenceResponse);
  rpc ControlPtz(ControlPtzRequest) returns (ControlPtzResponse);
  rpc SnapshotImage(SnapshotImageRequest) returns (SnapshotImageResponse);
  rpc ListGbDevices(ListGbDevicesRequest) returns (ListGbDevicesResponse);
  rpc GetGbDevice(GetGbDeviceRequest) returns (GetGbDeviceResponse);
  rpc CreateGbDevice(CreateGbDeviceRequest) returns (CreateGbDeviceResponse);
  rpc UpdateGbDevice(UpdateGbDeviceRequest) returns (UpdateGbDeviceResponse);
  rpc DeleteGbDevice(DeleteGbDeviceRequest) returns (DeleteGbDeviceResponse);
  rpc ListGbChannels(ListGbChannelsRequest) returns (ListGbChannelsResponse);
  rpc GetGbChannel(GetGbChannelRequest) returns (GetGbChannelResponse);
  rpc UpdateGbChannel(UpdateGbChannelRequest) returns (UpdateGbChannelResponse);
  rpc ListGbChannelImages(ListGbChannelImagesRequest) returns (ListGbChannelImagesResponse);
  rpc IssueGbChannelImageAccess(IssueGbChannelImageAccessRequest) returns (IssueGbChannelImageAccessResponse);
  rpc SetGbChannelCover(SetGbChannelCoverRequest) returns (UpdateGbChannelResponse);
  rpc GetGbChannelRecords(GetGbChannelRecordsRequest) returns (GetGbChannelRecordsResponse);
  rpc QueryGbChannelRecords(QueryGbChannelRecordsRequest) returns (GetGbChannelRecordsResponse);
  rpc ListGbResources(ListGbResourcesRequest) returns (ListGbResourcesResponse);
  rpc SaveGbResourceConfirmation(SaveGbResourceConfirmationRequest) returns (GbResourceResponse);
  rpc ResetGbResourceConfirmation(ResetGbResourceConfirmationRequest) returns (GbResourceResponse);
  rpc CreateCloudRecording(CreateCloudRecordingRequest) returns (CloudRecordingResponse);
  rpc ListCloudRecordings(ListCloudRecordingsRequest) returns (ListCloudRecordingsResponse);
  rpc GetCloudRecording(GetCloudRecordingRequest) returns (CloudRecordingResponse);
  rpc StopCloudRecording(StopCloudRecordingRequest) returns (CloudRecordingResponse);
  rpc DeleteCloudRecording(DeleteCloudRecordingRequest) returns (CloudRecordingResponse);
  rpc IssueCloudRecordingAccess(IssueCloudRecordingAccessRequest) returns (IssueCloudRecordingAccessResponse);
}

service SessionHook {
  rpc HandleHook(SessionHookRequest) returns (SessionHookResponse);
}

message SessionHookRequest {
  gmv.common.v1.OperationRef operation = 1;
  string event_type = 2;
  bytes payload_json = 3;
}

message SessionHookResponse {
  bool accepted = 1;
  bytes payload_json = 2;
  gmv.common.v1.ErrorDetail error = 3;
}

message StartDeviceStreamRequest {
  gmv.common.v1.OperationRef operation = 1;
  string device_id = 2;
  string channel_id = 3;
  string route_id = 4;
  string lease_id = 5;
  gmv.common.v1.NodeIdentity expected_session = 6;
  string token = 7;
  uint32 start_time_sec = 8;
  uint32 end_time_sec = 9;
  string trans_mode = 10;
  string output_type = 11;
  string broadcast_codec = 12;
  uint32 broadcast_sample_rate = 13;
  uint32 broadcast_channel_count = 14;
  uint32 broadcast_frame_duration_ms = 15;
  string audio_codec = 16;
  string playback_id = 17;
  string broadcast_id = 18;
  string broadcast_leg_id = 19;
  string expected_stream_node_id = 20;
  VideoStreamProfile video_stream_profile = 21;
}

enum VideoStreamProfile {
  VIDEO_STREAM_PROFILE_UNSPECIFIED = 0;
  VIDEO_STREAM_PROFILE_MAIN = 1;
  VIDEO_STREAM_PROFILE_SUB = 2;
}

enum StreamProfileVerification {
  STREAM_PROFILE_VERIFICATION_UNSPECIFIED = 0;
  STREAM_PROFILE_VERIFICATION_CONFIRMED = 1;
  STREAM_PROFILE_VERIFICATION_UNVERIFIED = 2;
}

message StopDeviceStreamRequest {
  gmv.common.v1.OperationRef operation = 1;
  string stream_id = 2;
  string reason = 3;
  string subscription_id = 4;
  bool force = 5;
  gmv.common.v1.NodeIdentity expected_session = 6;
  string stop_reason = 7;
}

message ListActiveStreamsRequest {
  string after_stream_id = 1;
  uint32 limit = 2;
  string stream_id = 3;
  string stream_node_id = 4;
  string device_id = 5;
  string channel_id = 6;
  string ssrc = 7;
  string state = 8;
  gmv.common.v1.NodeIdentity expected_session = 9;
}

message ListActiveStreamsResponse {
  repeated ActiveStreamItem items = 1;
  string next_after_id = 2;
  int64 server_time_ms = 3;
}

message ActiveStreamItem {
  string stream_id = 1;
  string session_node_id = 2;
  string session_instance_id = 3;
  string stream_node_id = 4;
  string device_id = 5;
  string channel_id = 6;
  string ssrc = 7;
  string state = 8;
  string dialog_state = 9;
  string media_state = 10;
  bool media_ready = 11;
  int64 created_at_ms = 12;
  int64 established_at_ms = 13;
  int64 started_at_ms = 14;
  string diagnostic_reason = 15;
  string session_type = 16;
  uint32 viewer_count = 17;
  repeated ActiveStreamViewerFormat viewer_formats = 18;
  repeated string supported_formats = 19;
  string output_format = 20;
  VideoStreamProfile requested_stream_profile = 21;
  VideoStreamProfile effective_stream_profile = 22;
  StreamProfileVerification stream_profile_verification = 23;
}

message ActiveStreamViewerFormat {
  string media_format = 1;
  uint32 viewer_count = 2;
}

message ListActiveStreamDialogsRequest {
  uint32 page = 1;
  uint32 page_size = 2;
  string stream_id = 3;
  string stream_node_id = 4;
  string device_id = 5;
  string channel_id = 6;
  string ssrc = 7;
  string dialog_state = 8;
  gmv.common.v1.NodeIdentity expected_session = 9;
}

message ListActiveStreamDialogsResponse {
  repeated ActiveStreamDialogItem items = 1;
  uint64 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  int64 server_time_ms = 5;
}

message ActiveStreamDialogItem {
  string stream_id = 1;
  string session_node_id = 2;
  string session_instance_id = 3;
  string stream_node_id = 4;
  string device_id = 5;
  string channel_id = 6;
  string ssrc = 7;
  string dialog_state = 8;
  int64 created_at_ms = 9;
  int64 established_at_ms = 10;
  int64 started_at_ms = 11;
  string session_type = 12;
  VideoStreamProfile requested_stream_profile = 13;
  VideoStreamProfile effective_stream_profile = 14;
  StreamProfileVerification stream_profile_verification = 15;
}

message GetActiveStreamManagementRequest {
  string stream_id = 1;
  gmv.common.v1.NodeIdentity expected_session = 2;
}

enum ActiveStreamManagementState {
  ACTIVE_STREAM_MANAGEMENT_STATE_UNSPECIFIED = 0;
  ACTIVE_STREAM_MANAGEMENT_STATE_ACTIVE = 1;
  ACTIVE_STREAM_MANAGEMENT_STATE_ENDED = 2;
}

message GetActiveStreamManagementResponse {
  ActiveStreamManagementState state = 1;
  ActiveStreamItem active = 2;
  StreamHistoryItem ended = 3;
}

message ListStreamHistoryRequest {
  uint32 page = 1;
  uint32 page_size = 2;
  string stream_id = 3;
  string stream_node_id = 4;
  string device_id = 5;
  string channel_id = 6;
  string ssrc = 7;
  string state = 8;
  gmv.common.v1.NodeIdentity expected_session = 9;
}

message ListStreamHistoryResponse {
  repeated StreamHistoryItem items = 1;
  uint64 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  int64 server_time_ms = 5;
}

message StreamHistoryItem {
  string stream_id = 1;
  string session_node_id = 2;
  string stream_node_id = 3;
  string device_id = 4;
  string channel_id = 5;
  string ssrc = 6;
  string session_type = 7;
  string state = 8;
  int64 created_at_ms = 9;
  int64 established_at_ms = 10;
  int64 terminated_at_ms = 11;
  int64 duration_ms = 12;
  string terminal_reason = 13;
  string error_code = 14;
  bool legacy_terminal_time = 15;
  string terminal_reason_label = 16;
  string stop_reason = 17;
  VideoStreamProfile requested_stream_profile = 18;
  VideoStreamProfile effective_stream_profile = 19;
  StreamProfileVerification stream_profile_verification = 20;
}

message SetPlaybackSpeedRequest {
  gmv.common.v1.OperationRef operation = 1;
  string stream_id = 2;
  float speed_rate = 3;
  string playback_id = 4;
  uint64 expected_generation = 5;
}

message SetPlaybackSpeedResponse {
  bool accepted = 1;
  gmv.common.v1.ErrorDetail error = 2;
  uint64 generation = 3;
}

message SeekPlaybackRequest {
  gmv.common.v1.OperationRef operation = 1;
  string playback_id = 2;
  string stream_id = 3;
  uint32 position_sec = 4;
  uint64 expected_generation = 5;
}

message SetPlaybackStateRequest {
  gmv.common.v1.OperationRef operation = 1;
  string playback_id = 2;
  string stream_id = 3;
  PlaybackState state = 4;
  uint64 expected_generation = 5;
  string subscription_id = 6;
}

message RefreshPlaybackPresenceRequest {
  repeated PlaybackPresenceHeartbeat items = 1;
}

message PlaybackPresenceHeartbeat {
  string playback_id = 1;
  string stream_id = 2;
  string subscription_id = 3;
  uint64 generation = 4;
}

message RefreshPlaybackPresenceResponse {
  int64 server_time_ms = 1;
  repeated PlaybackPresenceHeartbeatResult items = 2;
}

message PlaybackPresenceHeartbeatResult {
  string playback_id = 1;
  string stream_id = 2;
  bool accepted = 3;
  bool terminal = 4;
  uint64 generation = 5;
  optional int64 presence_deadline_ms = 6;
}

message PlaybackControlResponse {
  bool accepted = 1;
  gmv.common.v1.ErrorDetail error = 2;
  uint64 generation = 3;
  uint32 acknowledged_position_sec = 4;
  float acknowledged_speed_rate = 5;
  PlaybackState state = 6;
}

enum PlaybackState {
  PLAYBACK_STATE_UNSPECIFIED = 0;
  PLAYBACK_STATE_PLAYING = 1;
  PLAYBACK_STATE_PAUSED = 2;
}

message DeviceStreamResponse {
  string stream_id = 1;
  DeviceStreamState state = 2;
  gmv.common.v1.ErrorDetail error = 3;
  string endpoint = 4;
  string video_codec = 5;
  string audio_codec = 6;
  string subscription_id = 7;
  string session_node_id = 8;
  string session_instance_id = 9;
  string playback_id = 10;
  uint64 playback_generation = 11;
  string broadcast_profile = 12;
  VideoStreamProfile requested_stream_profile = 13;
  VideoStreamProfile effective_stream_profile = 14;
  StreamProfileVerification stream_profile_verification = 15;
}

enum DeviceStreamState {
  DEVICE_STREAM_STATE_UNSPECIFIED = 0;
  DEVICE_STREAM_STATE_STARTING = 1;
  DEVICE_STREAM_STATE_RUNNING = 2;
  DEVICE_STREAM_STATE_STOPPING = 3;
  DEVICE_STREAM_STATE_STOPPED = 4;
  DEVICE_STREAM_STATE_FAILED = 5;
}

message ControlPtzRequest {
  gmv.common.v1.OperationRef operation = 1;
  string device_id = 2;
  string channel_id = 3;
  string command = 4;
  uint32 speed = 5;
}

message ControlPtzResponse {
  bool accepted = 1;
  gmv.common.v1.ErrorDetail error = 2;
}

message SnapshotImageRequest {
  gmv.common.v1.OperationRef operation = 1;
