  uint64 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

message GbChannelImage {
  string image_id = 1;
  string device_id = 2;
  string channel_id = 3;
  string image_url = 4;
  int64 created_at_ms = 5;
  string file_name = 6;
  string content_type = 7;
