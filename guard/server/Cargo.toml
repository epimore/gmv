[package]
name = "gmv-guard-server"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "gmv_guard_server"
path = "src/lib.rs"

[[bin]]
name = "gmv-guard-server"
path = "src/main.rs"

[dependencies]
gmv-protocol = { path = "../../shared/protocol" }
gmv-nodec = { path = "../../shared/nodec" }
# base_mqtt = { git = "https://github.com/epimore/pigs.git", rev = "PIN_BEFORE_RELEASE" }
base_mqtt = { path = "../../../pigs/base_mqtt" }
parking_lot.workspace = true
thiserror = "2"
uuid = { version = "1.23", features = ["v4", "v7"] }
# base = { git = "https://github.com/epimore/pigs.git", rev = "6ef154f" }
base = { path = "../../../pigs/base" }
# base_db = { git = "https://github.com/epimore/pigs.git", rev = "6ef154f", default-features = false }
base_db = { path = "../../../pigs/base_db", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["derive"] }
# base_rpc = { git = "https://github.com/epimore/pigs.git", rev = "6ef154f" }
base_rpc = { path = "../../../pigs/base_rpc" }
tonic = "0.14"
prost = "0.14"
tokio-stream = "0.1"
reqwest = { workspace = true, features = ["stream"] }
url.workspace = true
axum = { workspace = true, features = ["multipart"] }
axum-server = { workspace = true, features = ["tls-rustls"] }
tower-http = { workspace = true, features = ["cors", "fs", "set-header"] }
argon2.workspace = true
rust-embed = { version = "8", optional = true }
hex = "0.4"
hmac = "0.12"
ipnet = "2.11"
sha2 = "0.10"


[dev-dependencies]
tower = { workspace = true, features = ["util"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }

[features]
default = ["db-all"]
db-all = ["db-mysql", "db-sqlite"]
db-mysql = ["base_db/mysql"]
db-sqlite = ["base_db/sqlite-bundled"]
embed-ui = ["dep:rust-embed"]
